# Wildcat Washers — Netlify deployment
# Static Astro build. Forms are handled by Netlify Forms (see src/components/QuoteForm.astro).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------- headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Astro fingerprints everything in /_astro, so it can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ------------------------------------------------------------- redirects
# Canonical host is wildcatwashers.com (no www). Old paths map to their new homes.
[[redirects]]
  from = "https://www.wildcatwashers.com/*"
  to = "https://wildcatwashers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/residential.html"
  to = "/services/"
  status = 301
  force = true

[[redirects]]
  from = "/residential/"
  to = "/services/"
  status = 301
  force = true

[[redirects]]
  from = "/commercial.html"
  to = "/commercial/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301
  force = true

[[redirects]]
  from = "/reviews.html"
  to = "/reviews/"
  status = 301
  force = true

[[redirects]]
  from = "/guarantees/"
  to = "/guarantee/"
  status = 301
  force = true

[[redirects]]
  from = "/services/window-cleaning/tucson/"
  to = "/services/window-cleaning/"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true


# The quote form posts to /api/quote when JavaScript is off (the Vercel function).
# Netlify has no such function, so send that post on to the thank-you page.
[[redirects]]
  from = "/api/quote"
  to = "/thank-you/"
  status = 303
  force = true
